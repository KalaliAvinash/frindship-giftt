<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>for Sunikshaaaaa — a few of you</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Karla:wght@400;500;600&family=Caveat:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #f4eef1;
    --bg-soft: #ede4e9;
    --card: #fffdfb;
    --ink: #332f3a;
    --ink-soft: #6e6674;
    --accent: #9c7c98;
    --accent-deep: #7a5c78;
    --gold: #c9a66b;
    --line: #e6dce3;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0;
    background: radial-gradient(120% 60% at 50% 0%, var(--bg) 0%, var(--bg-soft) 100%);
    color: var(--ink);
    font-family:'Karla', sans-serif;
    display:flex;
    justify-content:center;
    padding: 48px 16px 90px;
  }

  main{ width:100%; max-width: 560px; }

  .kicker{
    font-size:12px;
    letter-spacing:0.18em;
    text-transform:uppercase;
    color: var(--ink-soft);
    text-align:center;
    margin: 0 0 10px;
  }

  h1.title{
    font-family:'Fraunces', serif;
    font-style: italic;
    font-weight: 500;
    font-size: clamp(26px, 6vw, 34px);
    line-height:1.2;
    text-align:center;
    margin: 0 0 14px;
  }

  .intro{
    text-align:center;
    color: var(--ink-soft);
    font-size: 14px;
    max-width: 380px;
    margin: 0 auto 44px;
    line-height:1.6;
  }

  .wall{
    display:flex;
    flex-direction:column;
    gap: 34px;
  }

  .polaroid{
    background: var(--card);
    padding: 14px 14px 20px;
    border-radius: 4px;
    box-shadow: 0 18px 40px -20px rgba(51,47,58,0.4), 0 2px 6px rgba(51,47,58,0.08);
    width: 84%;
    opacity: 0;
    transform: translateY(24px) rotate(var(--rot,0deg));
    transition: transform 0.3s ease, box-shadow 0.3s ease;
  }
  .polaroid.in-view{
    animation: rise 0.75s ease forwards;
  }
  .polaroid:hover{
    transform: translateY(-4px) rotate(0deg) scale(1.02);
    box-shadow: 0 24px 50px -18px rgba(51,47,58,0.45);
  }

  .polaroid:nth-child(1){ --rot: -3deg; align-self: flex-start; margin-left: 0; }
  .polaroid:nth-child(2){ --rot: 2.5deg; align-self: flex-end; }
  .polaroid:nth-child(3){ --rot: -2deg; align-self: flex-start; margin-left: 8%; }
  .polaroid:nth-child(4){ --rot: 3deg; align-self: flex-end; margin-right: 4%; }
  .polaroid:nth-child(5){ --rot: -1.5deg; align-self: flex-start; }
  .polaroid:nth-child(6){ --rot: 2deg; align-self: flex-end; margin-right: 6%; }
  .polaroid:nth-child(7){ --rot: -2.5deg; align-self: flex-start; margin-left: 10%; }

  .polaroid img{
    display:block;
    width: 100%;
    aspect-ratio: 4 / 5;
    object-fit: cover;
    border-radius: 2px;
    background: var(--bg-soft);
  }

  .caption{
    font-family:'Caveat', cursive;
    font-size: 22px;
    color: var(--accent-deep);
    text-align:center;
    margin-top: 12px;
    line-height: 1.3;
  }

  .tag{
    display:block;
    font-family:'Karla', sans-serif;
    font-size: 10.5px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink-soft);
    text-align:center;
    margin-top: 2px;
  }

  .letter-card{
    margin-top: 54px;
    background: linear-gradient(160deg, #fff 0%, var(--bg-soft) 130%);
    border-radius: 20px;
    padding: 30px 24px;
    box-shadow: 0 20px 48px -26px rgba(51,47,58,0.4);
    opacity: 0;
    transform: translateY(20px);
  }
  .letter-card.in-view{ animation: rise 0.8s ease forwards; }
  .letter-label{
    font-family:'Fraunces', serif;
    font-style: italic;
    font-size: 22px;
    color: var(--accent-deep);
    text-align:center;
    margin: 0 0 16px;
  }
  .letter-card p{
    font-size: 14.5px;
    line-height:1.75;
    margin: 0 0 14px;
    color: var(--ink);
  }
  .letter-card p:last-child{ margin-bottom:0; }
  .letter-sign{
    font-family:'Fraunces', serif;
    font-style: italic;
    text-align:right;
    color: var(--accent-deep);
    margin-top: 18px;
  }

  .closing{
    margin-top: 44px;
    text-align:center;
  }

  .closing p{
    font-family:'Fraunces', serif;
    font-style: italic;
    font-size: 18px;
    color: var(--accent-deep);
    line-height:1.6;
    max-width: 380px;
    margin: 0 auto 30px;
  }

  .nav-row{
    display:flex;
    justify-content:center;
    gap: 14px;
  }

  .btn{
    font-family:'Karla', sans-serif;
    font-weight: 600;
    font-size: 14px;
    color: #fff;
    background: linear-gradient(135deg, var(--accent), var(--accent-deep));
    border:none;
    padding: 13px 26px;
    border-radius: 999px;
    cursor:pointer;
    text-decoration:none;
    box-shadow: 0 10px 24px -10px rgba(156,124,152,0.7);
    transition: transform 0.25s ease;
    display:inline-block;
  }
  .btn:hover{ transform: translateY(-2px); }
  .btn.ghost{
    background: transparent;
    color: var(--ink-soft);
    box-shadow:none;
    border: 1px solid var(--line);
  }
  .btn:focus-visible{ outline:2px solid var(--gold); outline-offset:3px; }

  @keyframes rise{ to{ opacity:1; transform: translateY(0) rotate(var(--rot,0deg)); } }

  @media (max-width: 480px){
    .polaroid{ width: 92%; }
    .polaroid:nth-child(3){ margin-left: 4%; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.01ms !important; transition-duration:0.01ms !important; }
    .polaroid{ opacity:1 !important; transform: rotate(var(--rot,0deg)) !important; }
  }
</style>
</head>
<body>
<main>

  <p class="kicker">a small archive</p>
  <h1 class="title">a few of <em>you</em></h1>
  <p class="intro">A mix of the "you" I've always known through a screen, and the "us" that's finally starting to happen too.</p>

  <div class="wall">
    <figure class="polaroid">
      <img src="photo5.jpg" alt="Sunikshaaaaa as a child, smiling, holding a sweet">
      <figcaption>
        <p class="caption">before the 10:30pm texts existed</p>
        <span class="tag">throwback</span>
      </figcaption>
    </figure>

    <figure class="polaroid">
      <img src="photo1.jpg" alt="Sunikshaaaaa as a young girl, smiling brightly">
      <figcaption>
        <p class="caption">that smile hasn't changed one bit</p>
        <span class="tag">throwback</span>
      </figcaption>
    </figure>

    <figure class="polaroid">
      <img src="photo2.jpg" alt="Sunikshaaaaa studying with headphones on, focused on her drafting work">
      <figcaption>
        <p class="caption">focus mode: unbothered, mildly dangerous</p>
        <span class="tag">12:27, deep in it</span>
      </figcaption>
    </figure>

    <figure class="polaroid">
      <img src="photo4.jpg" alt="Sunikshaaaaa with a bat-ear filter and purple lipstick">
      <figcaption>
        <p class="caption">villain era, fully committed</p>
        <span class="tag">no notes</span>
      </figcaption>
    </figure>

    <figure class="polaroid">
      <img src="photo3.jpg" alt="Sunikshaaaaa in a pink wig and sunglasses, playing UNO on the grass">
      <figcaption>
        <p class="caption">unbeatable at uno, unbothered by fashion logic</p>
        <span class="tag">certified chaos</span>
      </figcaption>
    </figure>

    <figure class="polaroid">
      <img src="photo6.jpg" alt="Sunikshaaaaa and Bunny sitting together, smiling">
      <figcaption>
        <p class="caption">and finally, an "us" photo</p>
        <span class="tag">not just texts anymore</span>
      </figcaption>
    </figure>
  </div>

  <div class="closing">
    <div class="nav-row">
      <a href="letter.html" class="btn ghost">← back to the letter</a>
      <a href="happy-friendship-day.html" class="btn">happy friendship day →</a>
    </div>
  </div>

</main>

<script>
  const cards = document.querySelectorAll('.polaroid');
  const io = new IntersectionObserver((entries) => {
    entries.forEach(e => {
      if(e.isIntersecting){
        e.target.classList.add('in-view');
        io.unobserve(e.target);
      }
    });
  }, { threshold: 0.2 });
  cards.forEach(c => io.observe(c));
</script>

</body>
</html>
